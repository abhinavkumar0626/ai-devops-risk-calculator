name: CI

on:
  push:
    branches: [ main, abhinavkumar0626-patch-1 ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: [3.10, 3.11]
    steps:
      - uses: actions/checkout@v4

      - name: Environment info
        run: |
          echo "RUNNING ON: $RUNNER_OS / $RUNNER_NAME"
          python -V
          pip -V
          whoami
          pwd
          ls -la

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run tests
        run: |
          # Fail fast so we get exit code; add -k pattern if tests hang
          pytest -q

      - name: Collect test logs
        if: always()
        run: |
          mkdir -p .github_action_logs
          cp -r tests .github_action_logs 2>/dev/null || true
          ls -la .github_action_logs || true

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            .github_action_logs
            tests/output
            test-results
